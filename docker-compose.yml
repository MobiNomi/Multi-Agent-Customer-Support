services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Keeps the database and saved conversations when the container is rebuilt or recreated.
      - support-data:/app/data
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  support-data:
