<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AcmeCloud Support</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232346D8'/%3E%3Crect x='7' y='8' width='4.5' height='16' rx='1.5' fill='white'/%3E%3Crect x='13.75' y='8' width='4.5' height='11' rx='1.5' fill='white'/%3E%3Crect x='20.5' y='8' width='4.5' height='7' rx='1.5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css?v=1.4.2">
</head>
<body class="panel-open">
  <header class="topbar">
    <a class="brand" href="/" aria-label="AcmeCloud Support home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="currentColor"/>
        <rect x="7" y="8" width="4.5" height="16" rx="1.5" fill="#fff"/>
        <rect x="13.75" y="8" width="4.5" height="11" rx="1.5" fill="#fff"/>
        <rect x="20.5" y="8" width="4.5" height="7" rx="1.5" fill="#fff"/>
      </svg>
      <span class="brand-name">AcmeCloud</span>
      <span class="brand-sub">Support</span>
    </a>
    <div class="topbar-actions">
      <label class="customer-picker" id="customer-wrap">
        <span class="customer-label">Demo customer</span>
        <select id="customer"></select>
      </label>
      <button id="new-chat" class="btn-quiet" type="button"><span class="label-long">Start new chat</span><span class="label-short">New chat</span></button>
      <button id="toggle-panel" class="btn-quiet" type="button" aria-controls="panel" aria-expanded="true">Hide details</button>
    </div>
  </header>

  <main class="layout">
    <section class="chat" aria-label="Conversation">
      <div id="log" class="log" role="log" aria-live="polite" aria-relevant="additions"></div>
      <div class="composer-wrap">
        <form id="composer" class="composer" autocomplete="off">
          <label for="input" class="sr-only">Message</label>
          <textarea id="input" rows="1" maxlength="4000" placeholder="Describe your problem or ask a question"></textarea>
          <button id="send" class="btn-send" type="submit">Send</button>
        </form>
        <p class="composer-hint">Enter to send. Shift+Enter for a new line.</p>
      </div>
    </section>

    <aside id="panel" class="panel" aria-labelledby="panel-title">
      <div class="panel-head">
        <h2 id="panel-title">Behind this reply</h2>
        <button id="close-panel" class="panel-close" type="button" aria-label="Close details">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="panel-body"></div>
    </aside>
  </main>

  <script src="/static/app.js?v=1.4.2" defer></script>
</body>
</html>
